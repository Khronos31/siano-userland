name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (glibc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev
      - name: Build and test
        run: make test

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: brew install libusb pkgconf
      - name: Build and test
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libusb)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make test

  alpine:
    name: Linux (musl / Alpine)
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb
        run: apk add --no-cache gcc make pkgconf musl-dev libusb-dev
      - name: Build and test
        run: make test

  android:
    name: Android (Termux aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y make file binutils curl
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: ./scripts/build-android.sh
      - name: File type
        run: file build/android-aarch64/siano-ts
