name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-invariants:
    name: Workflow invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Alpine build environments
        run: python3 scripts/check-workflow-invariants.py

  linux-source:
    name: Linux source tests (glibc)
    needs: workflow-invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install host libusb
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential pkg-config libusb-1.0-0-dev
      - name: Test source build
        run: |
          make test
          make packaging-test

  linux-static-x86_64:
    name: Linux x86_64 static (Alpine)
    needs: workflow-invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and audit in Alpine
        run: |
          docker run --rm \
            -e GITHUB_SHA \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src alpine:3.22 \
            sh -euxc '
              apk add --no-cache gcc make pkgconf musl-dev linux-headers libusb-dev python3 binutils git curl tar bzip2 su-exec
              install -d -o "$HOST_UID" -g "$HOST_GID" /tmp/runner-home
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home scripts/build-linux-static.sh --self-test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home \
                SOURCE_REF="$GITHUB_SHA" LINUX_ARCH=x86_64 scripts/build-linux-static.sh
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home \
                build/linux-x86_64/siano-ts --help >/dev/null
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make packaging-test
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux-x86_64
          path: build/linux-x86_64
          if-no-files-found: error

  linux-static-aarch64:
    name: Linux aarch64 static (Alpine)
    needs: workflow-invariants
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and audit in native arm64 Alpine
        run: |
          docker run --rm \
            -e GITHUB_SHA \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src alpine:3.22 \
            sh -euxc '
              apk add --no-cache gcc make pkgconf musl-dev linux-headers libusb-dev python3 binutils git curl tar bzip2 su-exec
              install -d -o "$HOST_UID" -g "$HOST_GID" /tmp/runner-home
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home scripts/build-linux-static.sh --self-test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home \
                SOURCE_REF="$GITHUB_SHA" LINUX_ARCH=aarch64 scripts/build-linux-static.sh
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home \
                build/linux-aarch64/siano-ts --help >/dev/null
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make packaging-test
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux-aarch64
          path: build/linux-aarch64
          if-no-files-found: error

  linux-static-ubuntu-x86_64:
    name: Linux x86_64 static startup (Ubuntu glibc)
    needs: linux-static-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-x86_64
          path: artifact
      - name: Start exact produced binary
        run: |
          test "$(find artifact -type f -name siano-ts | wc -l)" -eq 1
          binary=$(find artifact -type f -name siano-ts -print -quit)
          chmod +x "$binary"
          "$binary" --help >/dev/null

  linux-static-ubuntu-aarch64:
    name: Linux aarch64 static startup (Ubuntu glibc)
    needs: linux-static-aarch64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: bin-linux-aarch64
          path: artifact
      - name: Start exact produced binary
        run: |
          test "$(find artifact -type f -name siano-ts | wc -l)" -eq 1
          binary=$(find artifact -type f -name siano-ts -print -quit)
          chmod +x "$binary"
          "$binary" --help >/dev/null

  windows:
    name: Windows WinUSB x64
    needs: workflow-invariants
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - name: Fetch pinned libusb package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z' -OutFile libusb.7z
          if ((Get-FileHash libusb.7z -Algorithm SHA256).Hash.ToLower() -ne '7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79') { throw 'libusb package checksum mismatch' }
          7z x libusb.7z -olibusb-src
          New-Item -ItemType Directory -Force -Path libusb\include\libusb-1.0 | Out-Null
          Copy-Item libusb-src\include\libusb.h libusb\include\libusb-1.0\
          Copy-Item libusb-src\VS2022\MS64\dll\libusb-1.0.lib libusb\
          Copy-Item libusb-src\VS2022\MS64\dll\libusb-1.0.dll .
      - name: Build and run Windows target
        shell: pwsh
        run: |
          nmake /f Makefile.win
          .\siano-ts.exe --help | Out-Null
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          python scripts/audit-artifact.py --platform windows-x64 --binary siano-ts.exe --source-ref $env:GITHUB_SHA --evidence-output evidence\binary-audit.json

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install libusb
        run: brew install libusb pkgconf
      - name: Build and test
        run: |
          libusb_prefix=$(brew --prefix libusb)
          export PKG_CONFIG_PATH="$libusb_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make test
          scripts/audit-artifact.sh --platform darwin-arm64 --binary ./siano-ts \
            --source-ref "$GITHUB_SHA" --evidence-output evidence/binary-audit.json
          make packaging-test

  android:
    name: Android (Termux ${{ matrix.abi }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7a]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y make file binutils curl python3
      - name: Build and test
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          ./scripts/build-android.sh
          scripts/audit-artifact.sh --platform android-${{ matrix.abi }} \
            --binary build/android-${{ matrix.abi }}/siano-ts --source-ref "$GITHUB_SHA" \
            --evidence-output build/android-${{ matrix.abi }}/evidence/binary-audit.json
          make packaging-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-android-${{ matrix.abi }}
          path: build/android-${{ matrix.abi }}
          if-no-files-found: error
