name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version without a v prefix (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: siano-userland-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      publish: ${{ steps.prepare.outputs.publish }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the dispatch source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi
          git fetch --force origin main --tags
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "origin/main changed after this workflow was dispatched" >&2
            exit 1
          fi

      - name: Build and test
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libusb-1.0-0-dev
          make test

      - name: Prepare or recover the release tag
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be N.N.N without a v prefix" >&2
            exit 1
          fi
          tag="v$RELEASE_VERSION"

          if [[ -f VERSION ]]; then
            current="$(tr -d '[:space:]' < VERSION)"
            if [[ "$current" != "$RELEASE_VERSION" ]]; then
              printf '%s\n' "$RELEASE_VERSION" > VERSION
            fi
          else
            printf '%s\n' "$RELEASE_VERSION" > VERSION
          fi

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
            --sort=-version:refname \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
            | head -n 1 || true)"

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already exists on a different commit" >&2
              exit 1
            fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$latest_tag" ]]; then
            newest="$(printf '%s\n%s\n' "${latest_tag#v}" "$RELEASE_VERSION" | sort -V | tail -n 1)"
            if [[ "$newest" != "$RELEASE_VERSION" || "${latest_tag#v}" == "$RELEASE_VERSION" ]]; then
              echo "$RELEASE_VERSION is not newer than ${latest_tag#v}" >&2
              exit 1
            fi
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release exists without a fetched matching tag: $tag" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- VERSION; then
            git add VERSION
            git commit -m "Release $tag"
          fi
          git tag -a "$tag" -m "Release $tag"
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "origin/main changed during release validation" >&2
            exit 1
          fi
          gh auth setup-git --hostname github.com
          git push --atomic origin "HEAD:refs/heads/main" "refs/tags/$tag"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (musl)
    needs: prepare
    runs-on: ubuntu-latest
    container: alpine:3.21
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build
        run: |
          apk add --no-cache gcc make pkgconf musl-dev libusb-dev
          make
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-x86_64
          path: siano-ts

  macos:
    name: macOS
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Build
        run: |
          brew install libusb pkgconf
          export PKG_CONFIG_PATH="$(brew --prefix libusb)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make
      - uses: actions/upload-artifact@v4
        with:
          name: bin-darwin-arm64
          path: siano-ts

  android:
    name: Android (Termux ${{ matrix.abi }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7a]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y make file binutils curl
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ABI: ${{ matrix.abi }}
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bin-android-${{ matrix.abi }}
          path: build/android-${{ matrix.abi }}/siano-ts

  windows:
    name: Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: libusb
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/libusb/libusb/releases/download/v1.0.28/libusb-1.0.28.7z -OutFile libusb.7z
          7z x libusb.7z -olibusb-src
          New-Item -ItemType Directory -Force -Path libusb\include\libusb-1.0 | Out-Null
          Copy-Item libusb-src\include\libusb.h libusb\include\libusb-1.0\
          Copy-Item libusb-src\VS2022\MS64\dll\libusb-1.0.lib libusb\
          Copy-Item libusb-src\VS2022\MS64\dll\libusb-1.0.dll .
      - name: Build
        shell: cmd
        run: nmake /f Makefile.win
      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x64
          path: |
            siano-ts.exe
            libusb-1.0.dll

  publish:
    name: Pack and publish
    needs: [prepare, linux, macos, android, windows]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Firmware
        run: |
          mkdir -p firmware
          curl -fsSL -o firmware/isdbt_rio.inp \
            https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/isdbt_rio.inp
          echo "9b762c1808fd8da81bbec3e24ddb04a3  firmware/isdbt_rio.inp" | md5sum -c
      - name: Pack
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu
          VER="${TAG#v}"
          pack() {
            local name="$1" srcbin="$2" binname="$3"
            local dir="siano-ts-${VER}-${name}"
            mkdir -p "$dir/firmware"
            cp "$srcbin" "$dir/$binname"
            chmod +x "$dir/$binname" || true
            cp COPYING LICENCE.siano README.md "$dir/"
            cp firmware/isdbt_rio.inp "$dir/firmware/"
            if [ "$name" = "windows-x64" ]; then
              cp dist/bin-windows-x64/libusb-1.0.dll "$dir/"
              zip -r "${dir}.zip" "$dir"
            else
              tar -czf "${dir}.tar.gz" "$dir"
            fi
          }
          pack linux-x86_64 dist/bin-linux-x86_64/siano-ts siano-ts
          pack darwin-arm64 dist/bin-darwin-arm64/siano-ts siano-ts
          pack android-aarch64 dist/bin-android-aarch64/siano-ts siano-ts
          pack android-armv7a dist/bin-android-armv7a/siano-ts siano-ts
          pack windows-x64 dist/bin-windows-x64/siano-ts.exe siano-ts.exe
          ls -l siano-ts-*.tar.gz siano-ts-*.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG" \
            siano-ts-*.tar.gz siano-ts-*.zip
