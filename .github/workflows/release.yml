# SPDX-License-Identifier: GPL-2.0-or-later
name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: siano-userland-release-candidate
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify main dispatch
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse non-main dispatch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Release candidate must be dispatched from main, not $GITHUB_REF" >&2
            exit 1
          fi

  workflow-invariants:
    name: Workflow invariants
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check Alpine build environments
        run: python3 scripts/check-workflow-invariants.py

  linux-static:
    name: Linux x86_64 static (Alpine)
    needs: [preflight, workflow-invariants]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and audit in Alpine
        run: |
          docker run --rm \
            -e GITHUB_SHA \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" -w /src alpine:3.22 \
            sh -euxc '
              apk add --no-cache gcc make pkgconf musl-dev linux-headers libusb-dev python3 binutils git curl tar bzip2 su-exec
              install -d -o "$HOST_UID" -g "$HOST_GID" /tmp/runner-home
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home scripts/build-linux-static.sh --self-test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home \
                SOURCE_REF="$GITHUB_SHA" LINUX_ARCH=x86_64 scripts/build-linux-static.sh
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make packaging-test
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux-x86_64
          path: |
            build/linux-x86_64
          if-no-files-found: error

  linux-static-arm64:
    name: Linux aarch64 static (Alpine)
    needs: [preflight, workflow-invariants]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and audit in native arm64 Alpine
        run: |
          docker run --rm \
            -e GITHUB_SHA \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            alpine:3.22 \
            sh -euxc '
              apk add --no-cache gcc make pkgconf musl-dev linux-headers libusb-dev python3 binutils git curl tar bzip2 su-exec
              install -d -o "$HOST_UID" -g "$HOST_GID" /tmp/runner-home
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home scripts/build-linux-static.sh --self-test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make test
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home \
                SOURCE_REF="$GITHUB_SHA" LINUX_ARCH=aarch64 scripts/build-linux-static.sh
              su-exec "$HOST_UID:$HOST_GID" env HOME=/tmp/runner-home make packaging-test
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-linux-aarch64
          path: |
            build/linux-aarch64
          if-no-files-found: error

  macos:
    name: macOS arm64
    needs: preflight
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and audit
        run: |
          brew install libusb pkgconf
          libusb_prefix=$(brew --prefix libusb)
          export PKG_CONFIG_PATH="$libusb_prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          make test
          mkdir -p evidence
          scripts/audit-artifact.sh --platform darwin-arm64 --binary ./siano-ts \
            --source-ref "$GITHUB_SHA" \
            --evidence-output evidence/binary-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-darwin-arm64
          path: |
            siano-ts
            evidence/binary-audit.json
          if-no-files-found: error

  android:
    name: Android Termux ${{ matrix.abi }}
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [aarch64, armv7a]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410 # v1.5.0
        id: setup-ndk
        with:
          ndk-version: r27d
          add-to-path: false
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y make file binutils curl python3
      - name: Build and audit
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          ./scripts/build-android.sh
          scripts/audit-artifact.sh --platform android-${{ matrix.abi }} \
            --binary build/android-${{ matrix.abi }}/siano-ts \
            --source-ref "$GITHUB_SHA" \
            --evidence-output build/android-${{ matrix.abi }}/evidence/binary-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-android-${{ matrix.abi }}
          path: build/android-${{ matrix.abi }}
          if-no-files-found: error

  windows:
    name: Windows WinUSB x64
    needs: preflight
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: amd64
      - name: Fetch pinned libusb package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z' -OutFile libusb.7z
          if ((Get-FileHash libusb.7z -Algorithm SHA256).Hash.ToLower() -ne '7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79') { throw 'libusb package checksum mismatch' }
          7z x libusb.7z -olibusb-src
          New-Item -ItemType Directory -Force -Path libusb\include\libusb-1.0 | Out-Null
          Copy-Item libusb-src\include\libusb.h libusb\include\libusb-1.0\
          Copy-Item libusb-src\VS2022\MS64\dll\libusb-1.0.lib libusb\
          Copy-Item libusb-src\VS2022\MS64\dll\libusb-1.0.dll .
      - name: Build and audit
        shell: pwsh
        run: |
          nmake /f Makefile.win
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          python scripts/audit-artifact.py --platform windows-x64 --binary siano-ts.exe --source-ref $env:GITHUB_SHA --evidence-output evidence\binary-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-windows-x64
          path: |
            siano-ts.exe
            libusb-1.0.dll
            evidence/binary-audit.json
          if-no-files-found: error

  source:
    name: Corresponding source archive
    needs: [preflight, workflow-invariants]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned libusb source
        run: |
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$RUNNER_TEMP/libusb-1.0.30.tar.bz2" | sha256sum -c -
      - name: Package and audit
        run: |
          version=$(tr -d '\n' < VERSION)
          archive="siano-ts-$version-source.tar.gz"
          scripts/package-source.sh --version "$version" --source-ref "$GITHUB_SHA" \
            --source-root "$GITHUB_WORKSPACE" --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" \
            --output-dir "$RUNNER_TEMP/source-a"
          scripts/package-source.sh --version "$version" --source-ref "$GITHUB_SHA" \
            --source-root "$GITHUB_WORKSPACE" --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" \
            --output-dir "$RUNNER_TEMP/source-b"
          cmp "$RUNNER_TEMP/source-a/$archive" "$RUNNER_TEMP/source-b/$archive"
          scripts/audit-artifact.sh --source-archive --archive "$RUNNER_TEMP/source-a/$archive"
          mkdir -p "$RUNNER_TEMP/source"
          cp "$RUNNER_TEMP/source-a/$archive" "$RUNNER_TEMP/source/$archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-source
          path: ${{ runner.temp }}/source/*.tar.gz
          if-no-files-found: error

  source-relink-x86_64:
    name: Clean source rebuild and relink (x86_64)
    needs: source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: source
      - name: Rebuild and prove modified libusb was linked
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.22 sh -euxc '
            apk add --no-cache gcc make pkgconf musl-dev linux-headers libusb-dev python3 binutils git curl tar bzip2
            archive=$(find source -name "*-source.tar.gz" -type f -print -quit)
            tmp=$(mktemp -d)
            tar -xzf "$archive" -C "$tmp"
            "$tmp/repository/scripts/test-static-relink.sh" --source-archive "$archive" --arch x86_64
          '

  source-relink-aarch64:
    name: Clean source rebuild and relink (aarch64)
    needs: source
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: source
      - name: Rebuild and prove modified libusb was linked
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work alpine:3.22 sh -euxc '
            apk add --no-cache gcc make pkgconf musl-dev linux-headers libusb-dev python3 binutils git curl tar bzip2
            archive=$(find source -name "*-source.tar.gz" -type f -print -quit)
            # The helper is inside the corresponding source archive; extract it
            # and invoke it with the archive mounted in the same container.
            tmp=$(mktemp -d)
            tar -xzf "$archive" -C "$tmp"
            "$tmp/repository/scripts/test-static-relink.sh" --source-archive "$archive" --arch aarch64
          '

  package:
    name: Package candidate archives
    needs: [linux-static, linux-static-arm64, macos, android, windows, source, source-relink-x86_64, source-relink-aarch64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: bin-*
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rc-source
          path: dist/rc-source
      - name: Fetch and verify pinned release inputs
        run: |
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/isdbt_rio.inp" \
            'https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/isdbt_rio.inp?id=e981caea6ed33c48d25b7dbf473327dbd01df163'
          echo '054520642d5d09cb7ab7d08dbd6fd9ba9365de56adf2e7d7d06927f9845ff818  '"$RUNNER_TEMP/isdbt_rio.inp" | sha256sum -c -
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2
          echo 'fea36f34f9156400209595e300840767ab1a385ede1dc7ee893015aea9c6dbaf  '"$RUNNER_TEMP/libusb-1.0.30.tar.bz2" | sha256sum -c -
          curl -fsSL --retry 2 -o "$RUNNER_TEMP/libusb-1.0.30.7z" \
            https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.7z
          echo '7fb1dfec805b97983763d7d0ae244320da12add1003d4249c96cc4d586398c79  '"$RUNNER_TEMP/libusb-1.0.30.7z" | sha256sum -c -
      - name: Package, audit, and compare deterministic archives
        run: |
          set -eu
          version=$(tr -d '\n' < VERSION)
          mkdir -p candidate reproducibility
          package_all() {
            out="$1"
            scripts/package-artifact.sh --platform linux-x86_64 --version "$version" --source-ref "$GITHUB_SHA" --build-dir dist/bin-linux-x86_64 --firmware "$RUNNER_TEMP/isdbt_rio.inp" --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" --output-dir "$out"
            scripts/package-artifact.sh --platform linux-aarch64 --version "$version" --source-ref "$GITHUB_SHA" --build-dir dist/bin-linux-aarch64 --firmware "$RUNNER_TEMP/isdbt_rio.inp" --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" --output-dir "$out"
            scripts/package-artifact.sh --platform darwin-arm64 --version "$version" --source-ref "$GITHUB_SHA" --build-dir dist/bin-darwin-arm64 --firmware "$RUNNER_TEMP/isdbt_rio.inp" --output-dir "$out"
            scripts/package-artifact.sh --platform android-aarch64 --version "$version" --source-ref "$GITHUB_SHA" --build-dir dist/bin-android-aarch64 --firmware "$RUNNER_TEMP/isdbt_rio.inp" --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" --output-dir "$out"
            scripts/package-artifact.sh --platform android-armv7a --version "$version" --source-ref "$GITHUB_SHA" --build-dir dist/bin-android-armv7a --firmware "$RUNNER_TEMP/isdbt_rio.inp" --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" --output-dir "$out"
            scripts/package-artifact.sh --platform windows-x64 --version "$version" --source-ref "$GITHUB_SHA" --build-dir dist/bin-windows-x64 --firmware "$RUNNER_TEMP/isdbt_rio.inp" --libusb-source-archive "$RUNNER_TEMP/libusb-1.0.30.tar.bz2" --windows-package "$RUNNER_TEMP/libusb-1.0.30.7z" --output-dir "$out"
          }
          package_all candidate
          package_all reproducibility
          for archive in candidate/*; do
            name=$(basename "$archive")
            cmp -s "$archive" "reproducibility/$name"
          done
          source_archive="dist/rc-source/siano-ts-$version-source.tar.gz"
          cp "$source_archive" candidate/
          scripts/audit-artifact.sh --source-archive --archive "candidate/$(basename "$source_archive")"
          expected="siano-ts-$version-linux-x86_64.tar.gz siano-ts-$version-linux-aarch64.tar.gz siano-ts-$version-darwin-arm64.tar.gz siano-ts-$version-android-aarch64.tar.gz siano-ts-$version-android-armv7a.tar.gz siano-ts-$version-windows-x64.zip siano-ts-$version-source.tar.gz"
          read -r -a expected_names <<< "$expected"
          for name in "${expected_names[@]}"; do
            test -f "candidate/$name"
          done
          test "$(find candidate -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 7
          (cd candidate && sha256sum "${expected_names[@]}" > SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(wc -l < candidate/SHA256SUMS)" -eq 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-candidate
          path: candidate
          if-no-files-found: error

  packaged-runtime-x86_64:
    name: Final Linux x86_64 archive runtime smoke (Ubuntu glibc and Alpine musl)
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: candidate
      - name: Start downloaded final archive on Ubuntu glibc
        run: scripts/test-packaged-linux.sh --archive "$(find candidate -name '*-linux-x86_64.tar.gz' -type f -print -quit)" --architecture x86_64
      - name: Start the same downloaded final archive on Alpine musl
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/candidate:/candidate:ro" \
            alpine:3.22 sh -euxc '
              apk add --no-cache tar
              /repo/scripts/test-packaged-linux.sh \
                --archive "$(find /candidate -name "*-linux-x86_64.tar.gz" -type f -print -quit)" \
                --architecture x86_64
            '

  packaged-runtime-aarch64:
    name: Final Linux aarch64 archive runtime smoke (Ubuntu glibc and Alpine musl)
    needs: package
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-candidate
          path: candidate
      - name: Start downloaded final archive on native arm64 Ubuntu glibc
        run: scripts/test-packaged-linux.sh --archive "$(find candidate -name '*-linux-aarch64.tar.gz' -type f -print -quit)" --architecture aarch64
      - name: Start the same downloaded final archive on native arm64 Alpine musl
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -v "$GITHUB_WORKSPACE/candidate:/candidate:ro" \
            alpine:3.22 sh -euxc '
              apk add --no-cache tar
              /repo/scripts/test-packaged-linux.sh \
                --archive "$(find /candidate -name "*-linux-aarch64.tar.gz" -type f -print -quit)" \
                --architecture aarch64
            '
